<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskFlow - Login / Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2 id="form-title">Sign In to TaskFlow</h2>
        <div id="error-msg" class="error"></div>
        
        <form id="auth-form">
            <!-- Show name field only when registering -->
            <div id="name-field-container" style="display: none;">
                <input type="text" id="name" placeholder="Full Name">
            </div>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Sign In</button>
        </form>
        
        <p class="auth-switch" id="switch-text">
            Don't have an account? <span id="toggle-btn" style="color: #2563eb; cursor: pointer; font-weight: bold;">Create account</span>
        </p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
